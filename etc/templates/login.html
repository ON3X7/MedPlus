<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Med+ | Login & Cadastro</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/w3.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/alert.css"> <!-- notification pop-up -->
    <link rel="stylesheet" href="/css/fontawesome-free-7.2.0-web/css/all.min.css">
    <script src="/js/alert.js"></script> <!-- notification pop-up -->
</head>
<body class="w3-background-theme">
    <div class="login-wrapper" id="main-wrapper">
        
        <!-- Área Esquerda (Contém os dois formulários) -->
        <div class="forms-container">
            
            <!-- ABA 1: LOGIN -->
            <div id="panel-login" class="form-panel">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i> Med+
                </div>
                <div class="form-header">
                    <h1 class="form-title">Faça login na sua conta</h1>
                    <p class="form-subtitle">Bem-vindo de volta! Por favor, insira seus dados.</p>
                </div>

                <form id="form-login" action="/login_auth" method="POST">
                    <div class="input-group">
                        <label for="login-email">E-mail</label>
                        <input type="email" id="login-email" name="email" placeholder="Digite seu e-mail">
                        <span id="emailValidationAlert" class="w3-small w3-text-red w3-hide"></span>
                    </div>
                    <div class="input-group">
                        <label for="login-senha">Senha</label>
                        <input type="password" id="login-senha" name="senha" placeholder="••••••••">
                    </div>
                    <div class="form-options">
                        <label><input type="checkbox" name="lembrar"> Lembrar por 30 dias</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                    <button type="submit" class="btn-submit">Entrar</button>
                    <div class="signup-link">
                        Não tem uma conta? <span class="action-link" onclick="toggleForms()">Cadastre-se</span>
                    </div>
                </form>

                <div class="divider">ou</div>

                <button class="btn-google">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continuar com o Google
                </button>
            </div>

            <!-- ABA 2: CADASTRO -->
            <div id="panel-cadastro" class="form-panel">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i> Med+
                </div>
                <div class="form-header">
                    <h1 class="form-title">Crie sua conta</h1>
                    <p class="form-subtitle">Junte-se a nós e transforme sua rotina.</p>
                </div>

                <form id="form-cadastro" action="/register_auth" method="POST">
                    <div class="input-group">
                        <label for="cad-nome">Nome Completo</label>
                        <input type="text" id="cad-nome" name="nome" placeholder="Seu nome">
                    </div>
                    <div class="input-group">
                        <label for="cad-email">E-mail</label>
                        <input type="email" id="cad-email" name="email" placeholder="Digite seu e-mail">
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label for="cad-senha">Senha</label>
                            <input type="password" id="cad-senha" name="senha" placeholder="••••••••">
                        </div>
                        <div class="input-group">
                            <label for="cad-confirma">Confirmar Senha</label>
                            <input type="password" id="cad-confirma" name="confirma_senha" placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-submit">Cadastrar</button>
                    <div class="login-link">
                        Já tem uma conta? <span class="action-link" onclick="toggleForms()">Faça login</span>
                    </div>
                </form>

                <div class="divider">ou</div>

                <button class="btn-google">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continuar com o Google
                </button>
            </div>
        </div>

        <!-- Lado Direito (Animação Navy) -->
        <div class="login-right">
            <div class="roulette-wrapper">
                <div class="static-text">Sua vida. Sua carreira. Seu equilíbrio.</div>
                
                <div id="r-container" class="anim-container fade-in-up">
                    <h2 class="anim-title">
                        <i id="r-icon" class="fas fa-robot"></i>
                        <span id="r-title">Med+ AI</span>
                    </h2>
                    <p id="r-desc" class="anim-desc">inteligência pessoal</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleForms() {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.classList.toggle('wrapper-show-signup');
        }

        const options = [
            { title: "AI", desc: "inteligência pessoal", icon: "fa-robot" },
            { title: "Finance", desc: "fluxo financeiro", icon: "fa-wallet" },
            { title: "Agenda", desc: "plantões, congressos e compromissos", icon: "fa-calendar-alt" },
            { title: "Goals", desc: "metas", icon: "fa-bullseye" },
            { title: "Lifestyle", desc: "hábitos", icon: "fa-leaf" },
            { title: "Dream", desc: "sonhos", icon: "fa-cloud-moon" },
            { title: "Alert", desc: "Burnout Risk", icon: "fa-exclamation-triangle" },
            { title: "Insights", desc: "análises e recomendações", icon: "fa-lightbulb" }
        ];
        
        let currentIndex = 0;
        const containerEl = document.getElementById('r-container');
        const iconEl = document.getElementById('r-icon');
        const titleEl = document.getElementById('r-title');
        const descEl = document.getElementById('r-desc');

        setInterval(() => {
            containerEl.classList.remove('fade-in-up');
            void containerEl.offsetWidth; 
            
            currentIndex = (currentIndex + 1) % options.length;
            const item = options[currentIndex];
            
            iconEl.className = `fas ${item.icon}`;
            titleEl.textContent = `Med+ ${item.title}`;
            descEl.textContent = item.desc;
            
            containerEl.classList.add('fade-in-up');
        }, 3500); 
    </script>
    <script src="/js/email_validation.js"></script>
</body>
</html>
