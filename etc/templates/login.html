<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Med+ | Login & Cadastro</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/w3.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/notification.css"> <!-- notification pop-up -->
    <link rel="stylesheet" href="/css/fontawesome-free-7.2.0-web/css/all.min.css">
	<link rel="icon" type="image/x-icon" href="/img/iconApp_192x192.png">
    <script src="/js/ajax.js"></script>
    <script src="/js/login_form.js"></script>
    <script src="/js/notification.js"></script> <!-- notification pop-up -->
	<script src="https://accounts.google.com/gsi/client" async defer></script> <!-- API google auth -->
</head>
<body class="w3-background-theme">
    <div class="login-wrapper" id="main-wrapper">
        
        <!-- Área Esquerda (Contém os dois formulários) -->
        <div class="forms-container">
            
            <!-- ABA 1: LOGIN -->
            <div id="panel-login" class="form-panel">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i> Med+
                </div>
                <div class="form-header">
                    <h1 class="form-title">Faça login na sua conta</h1>
                    <p class="form-subtitle">Bem-vindo de volta! Por favor, insira seus dados.</p>
                </div>

                <form id="form-login" action="/medplus.php" method="POST">
					<input type="hidden" name="acao" value="validarLogin">
                    <div class="input-group">
                        <label for="email-login">E-mail</label>
                        <input type="email" id="email-login" name="email" placeholder="Digite seu e-mail" required>
                        <span id="emailAlert1" class="w3-small w3-text-red w3-hide"></span>
                    </div>
                    <div class="input-group">
                        <label for="senha-login">Senha</label>
                        <input type="password" id="senha-login" name="senha" placeholder="••••••••" required>
                    </div>
                    <div class="form-options">
                        <label><input type="checkbox" id="lembrar" name="lembrar" value="sim"> Lembrar por 30 dias</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>
                    <button type="button" id="button-login" class="btn-submit"onclick="logar();">Entrar</button>
                    <div class="signup-link">
                        Não tem uma conta? <span class="action-link" onclick="toggleForms()">Cadastre-se</span>
                    </div>
                </form>

                <div class="divider">ou</div>
				
				<!-- Contêiner do botão Google para Login -->
				<div id="btn-google-login" style="display: flex; justify-content: center; width: 100%; margin-top: 15px;"></div>
            </div>

            <!-- ABA 2: CADASTRO -->
            <div id="panel-cadastro" class="form-panel">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i> Med+
                </div>
                <div class="form-header">
                    <h1 class="form-title">Crie sua conta</h1>
                    <p class="form-subtitle">Junte-se a nós e transforme sua rotina.</p>
                </div>

                <form id="form-cadastro" action="/medplus.php" method="POST">
				<input type="hidden" name="acao" value="criarConta">
                    <div class="input-group">
                        <label for="nome-cadastro">Nome Completo</label>
                        <input type="text" id="nome-cadastro" name="nome" placeholder="Seu nome" required>
                    </div>
                    <div class="input-group">
                        <label for="email-cadastro">E-mail</label>
                        <input type="email" id="email-cadastro" name="email" placeholder="Digite seu e-mail" required>
						<span id="emailAlert2" class="w3-small w3-text-red w3-hide"></span>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label for="senha-cadastro">Senha</label>
                            <input type="password" id="senha-cadastro" name="senha" placeholder="••••••••" required>
                        </div>
                        <div class="input-group">
                            <label for="confirma-cadastro">Confirmar Senha</label>
                            <input type="password" id="confirma-cadastro" class="" name="confirma_senha" placeholder="••••••••" oninput="compararSenhas();" required>
                        </div>
                    </div>
                    
                    <button type="button" id="button-cadastro" class="btn-submit" onclick="registrar();">Cadastrar</button>
                    <div class="login-link">
                        Já tem uma conta? <span class="action-link" onclick="toggleForms()">Faça login</span>
                    </div>
                </form>

                <div class="divider">ou</div>
				<!-- Contêiner do botão Google para Cadastro -->
				<div id="btn-google-cadastro" style="display: flex; justify-content: center; width: 100%; margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Lado Direito (Animação Navy) -->
        <div class="login-right">
            <div class="roulette-wrapper">
                <div class="static-text">Sua vida. Sua carreira. Seu equilíbrio.</div>
                
                <div id="r-container" class="anim-container fade-in-up">
                    <h2 class="anim-title">
                        <i id="r-icon" class="fas fa-robot"></i>
                        <span id="r-title">Med+ AI</span>
                    </h2>
                    <p id="r-desc" class="anim-desc">inteligência pessoal</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleForms() {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.classList.toggle('wrapper-show-signup');
        }

        const options = [
            { title: "AI", desc: "inteligência pessoal", icon: "fa-robot" },
            { title: "Finance", desc: "fluxo financeiro", icon: "fa-wallet" },
            { title: "Agenda", desc: "plantões, congressos e compromissos", icon: "fa-calendar-alt" },
            { title: "Goals", desc: "metas", icon: "fa-bullseye" },
            { title: "Lifestyle", desc: "hábitos", icon: "fa-leaf" },
            { title: "Dream", desc: "sonhos", icon: "fa-cloud-moon" },
            { title: "Alert", desc: "Burnout Risk", icon: "fa-exclamation-triangle" },
            { title: "Insights", desc: "análises e recomendações", icon: "fa-lightbulb" }
        ];
        
        let currentIndex = 0;
        const containerEl = document.getElementById('r-container');
        const iconEl = document.getElementById('r-icon');
        const titleEl = document.getElementById('r-title');
        const descEl = document.getElementById('r-desc');

        setInterval(() => {
            containerEl.classList.remove('fade-in-up');
            void containerEl.offsetWidth; 
            
            currentIndex = (currentIndex + 1) % options.length;
            const item = options[currentIndex];
            
            iconEl.className = `fas ${item.icon}`;
            titleEl.textContent = `Med+ ${item.title}`;
            descEl.textContent = item.desc;
            
            containerEl.classList.add('fade-in-up');
        }, 3500); 
    </script>
    <script src="/js/email_validation.js"></script>
</body>
</html>
