<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Presume-se que o FontAwesome esteja disponível no mesmo caminho padrão do MedLife -->
    <link rel="stylesheet" href="/css/fontawesome-free-7.2.0-web/css/all.min.css">
    <style>
        /* Fundo que cobre toda a tela do navegador */
        .alerta-fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(243, 244, 246, 0.98); /* Fundo sólido off-white */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estrutura do Cartão */
        .alerta-card {
            background: #ffffff;
            width: 420px;
            max-width: 90%;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Metade Superior (Colorida com Ícone) */
        .alerta-header {
            padding: 45px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alerta-header i {
            font-size: 4.5rem;
            color: #ffffff;
        }

        /* Metade Inferior (Branca com Textos) */
        .alerta-body {
            padding: 35px 40px 45px;
        }

        .alerta-title {
            color: #2c3e50; /* Tom escuro para contraste */
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 15px 0;
        }

        .alerta-message {
            color: #6c7a89; /* Cinza médio */
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 0 0 35px 0;
        }

        /* Botão Arredondado */
        .btn-alerta {
            display: inline-block;
            padding: 12px 35px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-alerta:hover { filter: brightness(1.1); }
        .btn-alerta:active { transform: scale(0.95); }

        /* --- Controle de Temas Injetados pelo PHP --- */
        
        /* Erro (Vermelho) */
        .theme-error .alerta-header { background-color: #ef5350; }
        .theme-error .btn-alerta { background-color: #ef5350; }
        
        /* Sucesso (Medical Emerald) */
        .theme-success .alerta-header { background-color: #50c878; }
        .theme-success .btn-alerta { background-color: #50c878; }
        
        /* Processamento (Midnight Navy) */
        .theme-loading .alerta-header { background-color: #1b2452; }
        .theme-loading .btn-alerta { background-color: #1b2452; }
    </style>
</head>
<body>
    <div class="alerta-fullscreen-overlay {CLASSE_COR}">
        <div class="alerta-card">
            <div class="alerta-header">
                <i class="{ICONE}"></i>
            </div>
            <div class="alerta-body">
                <h2 class="alerta-title">{TITULO}</h2>
                <p class="alerta-message">{MENSAGEM}</p>
                {BOTAO}
            </div>
        </div>
    </div>
</body>
</html>
